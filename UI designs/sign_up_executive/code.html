<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-gutter font-body-md">
<!-- Transactional Screen: Navigation Suppressed -->
<div class="w-full max-w-[480px] bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-xl shadow-sm flex flex-col gap-lg relative overflow-hidden">
<!-- Minimal Graphic Element -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-bl-full -mr-8 -mt-8 pointer-events-none"></div>
<div class="text-center flex flex-col items-center gap-sm">
<div class="w-12 h-12 bg-primary text-on-primary rounded-lg flex items-center justify-center mb-xs">
<span class="material-symbols-outlined" style="font-size: 28px;">hub</span>
</div>
<h1 class="font-display text-display text-primary">Luminal HR</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create a new organization account</p>
</div>
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="companyName">Company Name</label>
<button class="text-primary hover:text-primary-fixed-dim transition-colors flex items-center gap-xs font-label-md text-label-md" title="Upload Company Logo" type="button">
<span class="material-symbols-outlined text-[16px]">upload_file</span>
<span>Upload Logo</span>
</button>
</div>
<input class="w-full h-10 px-md bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md placeholder:text-outline/50" id="companyName" placeholder="Enter company name" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<input class="w-full h-10 px-md bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md placeholder:text-outline/50" id="fullName" placeholder="Enter your full name" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="w-full h-10 px-md bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md placeholder:text-outline/50" id="email" placeholder="Enter professional email" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="phone">Phone Number</label>
<input class="w-full h-10 px-md bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md placeholder:text-outline/50" id="phone" placeholder="Enter phone number" type="tel"/>
</div>
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<input class="w-full h-10 px-md pr-10 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md placeholder:text-outline/50" id="password" placeholder="Create a password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword('password', 'visibility_icon_1')" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility_icon_1">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-surface" for="confirmPassword">Confirm Password</label>
<div class="relative">
<input class="w-full h-10 px-md pr-10 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md placeholder:text-outline/50" id="confirmPassword" placeholder="Confirm your password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword('confirmPassword', 'visibility_icon_2')" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility_icon_2">visibility_off</span>
</button>
</div>
</div>
<button class="w-full h-10 bg-primary text-on-primary rounded font-label-md text-label-md mt-sm hover:bg-primary/90 transition-colors flex items-center justify-center gap-xs" type="button">
<span>Sign Up</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="text-center pt-md border-t border-outline-variant/30 mt-xs">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary hover:underline font-label-md" href="#">Sign In</a>
</p>
</div>
</div>
<script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
